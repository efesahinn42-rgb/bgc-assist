version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bgcassist-db
    environment:
      POSTGRES_USER: bgcassist
      POSTGRES_PASSWORD: bgcassist123
      POSTGRES_DB: bgcassist
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
